name: Build Android APK - Codigo Master IPTV

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK with Capacitor (Android 5.0+)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install API 36 / 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" || true

      - name: Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application (Target ES2018 / Android 5+)
        run: |
          npm run build

      - name: Sync Capacitor Android Platform
        run: |
          npx cap telemetry off || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug -x test -x lint --no-daemon --stacktrace
        env:
          JAVA_OPTS: "-Xmx3072m"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3072m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Codigo-Master-IPTV-Android5-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
