name: Build Android APK - Codigo Master IPTV

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK with Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install NPM Dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Build Web Application
        run: |
          npm run build

      - name: Add & Sync Android Platform (Fresh Build)
        run: |
          npx cap telemetry off || true
          rm -rf android
          npx cap add android
          
          # Ensure cleartext HTTP traffic for IPTV streams in AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml || true
          
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          JAVA_OPTS: "-Xmx3072m"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3072m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Codigo-Master-IPTV-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

